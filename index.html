<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Navigation System</title>
    <style>
        body {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .sidebar {
            background-color: white;
            width: 250px;
            height: 100vh;
            position: fixed;
            padding: 15px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
        }
        .main-content {
            margin-left: 270px;
            padding: 20px;
            color: #333;
        }
        .header {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .project-card {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 15px;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Menu</h2>
        <ul id="menu"></ul>
    </div>
    <div class="main-content">
        <h1 class="header">Welcome to the Project</h1>
        <div id="projects"></div>
        <iframe id="content-frame" style="width:100%; height:600px; border:none;"></iframe>
    </div>
    <script>
        async function loadMenu() {
            const response = await fetch('pages.json');
            const pages = await response.json();
            const menu = document.getElementById('menu');
            pages.forEach(page => {
                const li = document.createElement('li');
                li.innerHTML = `<a href="#" onclick="loadPage('${page.url}')">${page.title}</a>`;
                menu.appendChild(li);
            });
        }

        async function loadPage(url) {
            const frame = document.getElementById('content-frame');
            frame.src = url;
        }

        async function loadProjects() {
            const response = await fetch('projects.json');
            const projects = await response.json();
            const projectContainer = document.getElementById('projects');
            projects.forEach(project => {
                const card = document.createElement('div');
                card.className = 'project-card';
                card.innerHTML = `<h3>${project.title}</h3><p>${project.description}</p>`;
                projectContainer.appendChild(card);
            });
        }

        loadMenu();
        loadProjects();
    </script>
</body>
</html>
