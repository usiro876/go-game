<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Navigation System</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            font-family: Arial, sans-serif;
        }
        .sidebar {
            background-color: white;
            width: 250px;
            height: 100vh;
            position: fixed;
            top: 0;
            left: 0;
            padding: 15px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        .sidebar h2 { margin-bottom: 10px; }
        .main-content {
            margin-left: 250px;
            height: 100vh;
            display: flex;
            flex-direction: column;
        }
        #welcome {
            padding: 40px;
            color: white;
            text-align: center;
        }
        #welcome h1 { font-size: 28px; margin-bottom: 10px; }
        #welcome p { font-size: 16px; opacity: 0.9; }
        #content-frame {
            width: 100%;
            flex: 1;
            border: none;
            display: none;
            background: white;
        }
        #menu ul {
            list-style: none;
        }
        #menu li {
            margin: 3px 0;
        }
        #menu a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: #333;
            border-radius: 5px;
            font-size: 14px;
        }
        #menu a:hover {
            background-color: #e0e0e0;
        }
        #menu a.active {
            background-color: #2575fc;
            color: white;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Menu</h2>
        <div id="menu"></div>
    </div>
    <div class="main-content">
        <div id="welcome">
            <h1>Welcome</h1>
            <p>左のメニューからページを選択してください</p>
        </div>
        <iframe id="content-frame"></iframe>
    </div>
    <script>
        async function loadMenu() {
            try {
                const response = await fetch('pages.json', { cache: 'no-cache' });
                if (!response.ok) throw new Error('HTTP error: ' + response.status);
                const pages = await response.json();
                const menu = document.getElementById('menu');
                const ul = document.createElement('ul');

                pages.forEach(page => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = '#';
                    a.textContent = page.title;
                    a.onclick = (e) => {
                        e.preventDefault();
                        loadPage(page.path, a);
                    };
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                menu.appendChild(ul);
            } catch (error) {
                console.error('Error loading menu:', error);
                document.getElementById('menu').innerHTML = '<p>メニューの読み込みに失敗しました</p>';
            }
        }

        function loadPage(path, linkElement) {
            const frame = document.getElementById('content-frame');
            const welcome = document.getElementById('welcome');
            welcome.style.display = 'none';
            frame.style.display = 'block';
            frame.src = path;

            if (linkElement) {
                document.querySelectorAll('#menu a').forEach(a => a.classList.remove('active'));
                linkElement.classList.add('active');
            }
        }

        document.addEventListener('DOMContentLoaded', loadMenu);
    </script>
</body>
</html>
