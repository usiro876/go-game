<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Auto-Navigation System</title>
    <style>
        body {
            background: linear-gradient(to right, #6a11cb, #2575fc);
            font-family: Arial, sans-serif;
            margin: 0;
            padding: 0;
        }
        .sidebar {
            background-color: white;
            width: 250px;
            height: 100vh;
            position: fixed;
            padding: 15px;
            box-shadow: 2px 0 5px rgba(0,0,0,0.5);
            overflow-y: auto;
        }
        .main-content {
            margin-left: 270px;
            padding: 20px;
            color: #333;
        }
        .header {
            font-size: 24px;
            margin-bottom: 20px;
        }
        .project-card {
            border: 1px solid #ccc;
            border-radius: 5px;
            padding: 10px;
            margin-bottom: 15px;
        }
        #menu a {
            display: block;
            padding: 10px;
            text-decoration: none;
            color: #333;
            border-radius: 3px;
        }
        #menu a:hover {
            background-color: #e0e0e0;
        }
        #menu a.active {
            background-color: #2575fc;
            color: white;
        }
        #menu ul {
            list-style: none;
            padding: 0;
            margin: 0;
        }
        #menu li {
            margin: 5px 0;
        }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Menu</h2>
        <div id="menu"></div>
    </div>
    <div class="main-content">
        <h1 class="header">Welcome to the Project</h1>
        <div id="projects"></div>
        <iframe id="content-frame" style="width:100%; height:600px; border:none;"></iframe>
    </div>
    <script>
        async function loadMenu() {
            try {
                const response = await fetch('pages.json');
                if (!response.ok) throw new Error(`HTTP error! status: ${response.status}`);
                const pages = await response.json();
                const menu = document.getElementById('menu');
                const ul = document.createElement('ul');
                
                pages.forEach((page, index) => {
                    const li = document.createElement('li');
                    const a = document.createElement('a');
                    a.href = '#';
                    a.textContent = page.title;
                    a.onclick = (e) => {
                        e.preventDefault();
                        loadPage(page.path, a);
                    };
                    // 最初のページをアクティブに
                    if (index === 0) {
                        a.classList.add('active');
                    }
                    li.appendChild(a);
                    ul.appendChild(li);
                });
                menu.appendChild(ul);
                
                // 最初のページを読み込む
                if (pages.length > 0) {
                    loadPage(pages[0].path);
                }
            } catch (error) {
                console.error('Error loading menu:', error);
                document.getElementById('menu').innerHTML = '<p>Error loading menu</p>';
            }
        }

        function loadPage(path, linkElement) {
            try {
                const frame = document.getElementById('content-frame');
                // リポジトリが GitHub Pages で公開されている場合、パスを正しく解決
                frame.src = path;
                
                // アクティブリンクを更新
                if (linkElement) {
                    const allLinks = document.querySelectorAll('#menu a');
                    allLinks.forEach(link => link.classList.remove('active'));
                    linkElement.classList.add('active');
                }
            } catch (error) {
                console.error('Error loading page:', error);
            }
        }

        async function loadProjects() {
            try {
                const response = await fetch('projects.json');
                if (!response.ok) {
                    // projects.json が存在しない場合はスキップ
                    console.log('projects.json not found, skipping');
                    return;
                }
                const projects = await response.json();
                const projectContainer = document.getElementById('projects');
                projects.forEach(project => {
                    const card = document.createElement('div');
                    card.className = 'project-card';
                    card.innerHTML = `<h3>${project.title}</h3><p>${project.description}</p>`;
                    projectContainer.appendChild(card);
                });
            } catch (error) {
                console.error('Error loading projects:', error);
            }
        }

        // 初期化
        document.addEventListener('DOMContentLoaded', () => {
            loadMenu();
            loadProjects();
        });
    </script>
</body>
</html>
